<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Own</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .card { background: #fff; border-radius: 20px; padding: 40px 32px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; color: #141414; }
    p { color: #666; font-size: 15px; margin-bottom: 28px; }
    .btn { display: inline-block; background: #0A66D9; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 50px; font-weight: 600; font-size: 16px; }
    .btn:hover { background: #0856b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Next Own</h1>
    <p>Opening listing in the app...</p>
    <a id="open-btn" class="btn" href="#">Open in App</a>
  </div>
  <script>
    var pathParts = window.location.pathname.split('/').filter(Boolean);
    var listingId = pathParts[pathParts.length - 1] || '';
    var appUrl = 'nextown:///listing/' + listingId;
    var btn = document.getElementById('open-btn');
    btn.href = appUrl;
    if (listingId) {
      window.location.replace(appUrl);
    }
  </script>
</body>
</html>
